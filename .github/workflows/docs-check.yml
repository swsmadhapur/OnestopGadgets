name: Living Documentation Impact Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Documentation Impact Validator
        run: |
          chmod +x ./scripts/docs-impact-check.sh
          ./scripts/docs-impact-check.sh
