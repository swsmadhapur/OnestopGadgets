version: '3.8'

services:
  # Nginx Reverse Proxy
  web:
    image: nginx:alpine
    container_name: osg_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../../backend:/var/www/html:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - osg_network

  # PHP 8.3-FPM Backend (Laravel 11)
  app:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: osg_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../../backend:/var/www/html
    environment:
      APP_NAME: "One Stop Gadgets"
      APP_ENV: local
      APP_KEY: base64:sampleKeyForDockerLocalDevEnvOnly123456=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: onestopgadgets
      DB_USERNAME: osg_user
      DB_PASSWORD: osg_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - osg_network

  # MySQL 8.4 LTS
  db:
    image: mysql:8.4
    container_name: osg_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: onestopgadgets
      MYSQL_USER: osg_user
      MYSQL_PASSWORD: osg_password
      MYSQL_ROOT_PASSWORD: osg_root_password
    ports:
      - "3306:3306"
    volumes:
      - osg_mysql_data:/var/lib/mysql
    networks:
      - osg_network

  # phpMyAdmin (Isolated to Port 8081 for Local Administration)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: osg_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: osg_root_password
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - osg_network

  # Redis 7 Cache & Queues
  redis:
    image: redis:7-alpine
    container_name: osg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - osg_redis_data:/data
    networks:
      - osg_network

networks:
  osg_network:
    driver: bridge

volumes:
  osg_mysql_data:
  osg_redis_data:
